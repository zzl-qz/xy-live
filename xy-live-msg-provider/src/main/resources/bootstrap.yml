spring:
  application:
    name: xy-live-msg-provider
  cloud:
    nacos:
      discovery:
#        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
#        namespace: xy-live-test
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        import-check:
          enabled: false
        # 当前服务启动后去nacos中读取配置文件的后缀
        file-extension: yaml
        # 读取配置的nacos地址
#        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
#        namespace: xy-live-test
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 读取配置的nacos的名空间
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
