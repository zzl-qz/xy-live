spring:
  application:
    name: xy-live-living-provider
  cloud:
    nacos:
      discovery:
#        server-addr: 1.14.157.207:8848
#        namespace: xy-live-test
        server-addr: localhost:8848
        namespace: 82403fdd-8d83-400e-991a-b9294934045b
      config:
        import-check:
          enabled: false
        # 当前服务启动后去nacos中读取配置文件的后缀
        file-extension: yml
#        server-addr: 1.14.157.207:8848
#        namespace: xy-live-test
        # 读取配置的nacos地址
        server-addr: localhost:8848
        # 读取配置的nacos的名空间
        namespace: 82403fdd-8d83-400e-991a-b9294934045b
        group: DEFAULT_GROUP
  config:
    import:
      - optional:nacos:${spring.application.name}.yml