name: Bug 报告
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，避免重复。

        **安全漏洞请勿在此公开提交**，请通过维护者主页邮箱私下联系。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰说明出现了什么问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出最小可复现路径
      placeholder: |
        1. 启动 xxx-provider
        2. 调用 POST /api/...
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 异常堆栈 / 日志
      description: 请脱敏，删除密码、Token、手机号、真实 IP
      render: shell
    validations:
      required: false

  - type: input
    id: module
    attributes:
      label: 涉及模块
      placeholder: 例如 xy-live-gift-provider
    validations:
      required: true

  - type: input
    id: jdk
    attributes:
      label: JDK 版本
      placeholder: 例如 17.0.9
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 / macOS 14 / Ubuntu 22.04
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 中间件版本、Nacos 配置差异、是否可稳定复现等
    validations:
      required: false
