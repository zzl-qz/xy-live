server:
  port: 9191
spring:
  application:
    name: xy-live-gateway
  cloud:
    nacos:
      discovery:
#        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
#        namespace: xy-live-test
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        import-check:
          enabled: false
        # 当前服务启动后去nacos中读取配置文件的后缀
        file-extension: yaml
#        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
#        namespace: xy-live-test
        # 读取配置的nacos地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 读取配置的nacos的名空间
        namespace: ${NACOS_NAMESPACE:}
  config:
    import:
      - optional:nacos:xy-live-gateway.yaml

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
