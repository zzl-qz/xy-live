spring:
  application:
    name: xy-live-id-generate-provider
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${XY_ID_DB_URL:jdbc:mysql://127.0.0.1:3306/xy_live_common?useUnicode=true&characterEncoding=utf8}
    username: ${XY_ID_DB_USERNAME:root}
    password: ${XY_ID_DB_PASSWORD:CHANGE_ME}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20

dubbo:
  application:
    name: ${spring.application.name}
  provider:
    anyhost: true
    timeout: 5000
  registry:
    address: nacos://${NACOS_SERVER_ADDR:localhost:8848}?namespace=${NACOS_NAMESPACE:}
  protocol:
    name: dubbo
    port: 9103
    host: 0.0.0.0
    threadpool: fixed
    dispatcher: execution
    threads: 1000
    accepts: 1000
