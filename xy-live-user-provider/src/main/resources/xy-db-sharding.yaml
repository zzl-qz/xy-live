dataSources:
  user_master:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbcUrl: ${XY_DB_JDBC_URL:jdbc:mysql://127.0.0.1:3306/xy_live_user?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${XY_DB_USERNAME:root}
    password: ${XY_DB_PASSWORD:CHANGE_ME}

rules:
  - !SINGLE
    defaultDataSource: user_master
  - !SHARDING
    tables:
      t_user:
        actualDataNodes: user_master.t_user_${(0..99).collect(){it.toString().padLeft(2,'0')}}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: t_user-inline
      t_user_index:
        actualDataNodes: user_master.t_user_index
      t_user_tag:
        actualDataNodes: user_master.t_user_tag_${(0..99).collect(){it.toString().padLeft(2,'0')}}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: t_user-tag-inline
      t_user_phone:
        actualDataNodes: user_master.t_user_phone_${(0..99).collect(){it.toString().padLeft(2,'0')}}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: t_user_phone-inline
    shardingAlgorithms:
      t_user-inline:
        type: INLINE
        props:
          algorithm-expression: t_user_${(user_id % 100).toString().padLeft(2,'0')}
      t_user-tag-inline:
        type: INLINE
        props:
          algorithm-expression: t_user_tag_${(user_id % 100).toString().padLeft(2,'0')}
      t_user_phone-inline:
        type: INLINE
        props:
          algorithm-expression: t_user_phone_${(user_id % 100).toString().padLeft(2,'0')}

props:
  sql-show: false
